name: probe
on: { push: { branches: [probe] } }
jobs:
  p:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: |
          (
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          for u in \
            "https://site.api.espn.com/apis/site/v2/sports/tennis/atp/scoreboard" \
            "https://api.sofascore.com/api/v1/sport/tennis/scheduled-events/2026-10-20" \
            "https://www.sofascore.com/api/v1/sport/tennis/scheduled-events/2026-10-20" \
            "https://www.thesportsdb.com/api/v1/json/3/searchplayers.php?p=Andrea%20De%20Marchi" \
            "https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=401773100" \
            "https://site.web.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=401810000" \
            "https://api.sofascore.com/api/v1/sport/table-tennis/scheduled-events/2026-10-20" \
            "https://api.sofascore.com/api/v1/sport/esports/scheduled-events/2026-10-20" ; do
            echo "=== $u"; curl -s -m 20 -A "$UA" -w "\nHTTP %{http_code}\n" "$u" | head -c 400; echo; done
          echo "=== sofa H2H sample"
          ID=$(curl -s -A "$UA" "https://api.sofascore.com/api/v1/sport/tennis/scheduled-events/2026-10-20" | python3 -c "import sys,json;d=json.load(sys.stdin);e=[x for x in d['events'] if 'Marchi' in json.dumps(x)];print(e[0]['id'] if e else d['events'][0]['id'])" 2>&1)
          echo "id $ID"; for k in h2h "h2h/events" pregame-form; do curl -s -A "$UA" "https://api.sofascore.com/api/v1/event/$ID/$k" | head -c 800; echo; done
          ) > probe.txt 2>&1
          git config user.name primo-bot; git config user.email bot@example.com; git add probe.txt; git commit -m out; git push
