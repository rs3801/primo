name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/p.py
      - run: |
          git config user.name primo-bot
          git config user.email bot@example.com
          git add probe.txt
          git commit -m out
          git push
