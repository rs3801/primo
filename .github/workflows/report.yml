name: Primo report card
on:
  schedule:
    - cron: "44 * * * *"   # every hour, after the prices update
  workflow_dispatch: {}
  push:
    paths: ["scripts/report.py", ".github/workflows/report.yml"]
permissions:
  contents: write
concurrency:
  group: report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: python scripts/report.py
      - name: Save report card
        run: |
          git config user.name "primo-bot"
          git config user.email "primo-bot@users.noreply.github.com"
          git add data/report_log.json data/report.js
          git diff --cached --quiet && exit 0
          git commit -m "Report card update"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1
