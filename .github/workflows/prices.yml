name: Update Kalshi prices
on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch: {}
  push:
    paths: ["scripts/**", ".github/workflows/prices.yml"]
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_prices.py
      - run: python scripts/fetch_facts.py || echo 'facts skipped'
      - name: Save new prices
        run: |
          git config user.name "primo-bot"
          git config user.email "primo-bot@users.noreply.github.com"
          for f in data/prices.js data/baseline.json data/scorecard.json data/scorecard.js data/facts.js; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "Prices update"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1
